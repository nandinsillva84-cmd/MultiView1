<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0814">
<title>TwitchView</title>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<style>
:root{--bg:#0b0814;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--txt:#f2eeff;--mute:#a79dc4;--a:#9b6bff;--b:#ff4fa3;--c:#35d0ff;--ok:#3ddc97;--g:linear-gradient(135deg,#9b6bff,#ff4fa3);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
body::before,body::after{content:"";position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none}
body::before{background:#6a3dff;top:-35vmax;left:-25vmax}
body::after{background:#ff2f8f;bottom:-40vmax;right:-30vmax;opacity:.25}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;box-shadow:0 6px 20px #9b6bff66}
.logo svg{fill:#fff;stroke:none;width:18px;height:18px}
h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.03em}
h1 span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(14px)}
#add{display:flex;gap:8px;margin:6px 16px;padding:5px 5px 5px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
#add:focus-within{border-color:var(--a);box-shadow:0 0 0 3px #9b6bff33}
input{flex:1;min-width:0;font:inherit;color:var(--txt);background:none;border:0}
input::placeholder{color:var(--mute)}
#add button{width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 4px 16px #ff4fa355}
#chips{display:flex;gap:10px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;min-height:70px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:9px;padding:5px 8px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);transition:.2s}
.chip.on{background:var(--glass2);border-color:transparent;box-shadow:0 0 0 2px var(--a),0 6px 24px #9b6bff55}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;text-transform:uppercase}
.chip b{font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.chip .x{color:var(--mute);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.chip .x svg{width:13px;height:13px}
#stage{flex:1;min-height:0;display:grid;gap:10px;padding:4px 12px 100px;overflow-y:auto;grid-auto-rows:minmax(190px,1fr)}
.cell{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 10px 30px #0008}
.cell iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tag{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#000a;backdrop-filter:blur(8px);pointer-events:none}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c}
.empty{grid-column:1/-1;align-self:center;text-align:center;padding:24px;color:var(--mute)}
.empty .big{width:96px;height:96px;margin:0 auto 18px;border-radius:30px;background:var(--g);display:grid;place-items:center;box-shadow:0 14px 50px #9b6bff77}
.empty .big svg{width:42px;height:42px;fill:#fff;stroke:none}
.empty h2{color:var(--txt);font-size:20px;margin-bottom:6px}
.sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.sug button{padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--txt)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(24,18,44,.75);border:1px solid var(--line);backdrop-filter:blur(20px);box-shadow:0 12px 40px #000a;z-index:5}
.dock button{min-width:38px;height:42px;padding:0 10px;border-radius:999px;font-weight:700;display:grid;place-items:center;color:var(--mute);transition:.2s}
.dock button.on{background:var(--g);color:#fff;box-shadow:0 4px 16px #9b6bff77}
.dock i{width:1px;height:22px;background:var(--line)}
.tg{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);font-weight:600;color:var(--mute);transition:.2s}
.tg u{width:34px;height:20px;border-radius:99px;background:#ffffff26;position:relative;transition:.2s}
.tg u::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{color:var(--ok);border-color:#3ddc9755;box-shadow:0 0 20px #3ddc9733}
.tg.on u{background:var(--ok)}.tg.on u::after{left:16px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#171128;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:13px;z-index:9;box-shadow:0 10px 30px #000a}
.net{display:flex;align-items:center;gap:8px;margin:2px 18px 0;font-size:12px;color:var(--mute)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--mute);box-shadow:0 0 8px currentColor}
.net.g{color:var(--ok)}.net.g i{background:var(--ok)}
.net.y{color:#ffc857}.net.y i{background:#ffc857}
.net.r{color:#ff5c7a}.net.r i{background:#ff5c7a}
.promo{position:relative;display:flex;gap:14px;align-items:center;margin:6px 16px 8px;padding:14px;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,rgba(83,252,24,.16),rgba(53,208,255,.1) 60%,rgba(155,107,255,.14));border:1px solid rgba(83,252,24,.35)}
.promo::before{content:"";position:absolute;width:150px;height:150px;right:-40px;top:-70px;background:#53fc18;filter:blur(60px);opacity:.22;pointer-events:none}
.promo[hidden]{display:none}
.pv{flex:none;width:76px;height:76px;border-radius:20px;overflow:hidden;border:1px solid #53fc1888;box-shadow:0 8px 28px #53fc1844}
.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pt{min-width:0;flex:1;padding-right:18px}
.soon{display:inline-block;font-size:11px;font-weight:700;color:#0b0814;background:#53fc18;border-radius:99px;padding:2px 9px;margin-bottom:5px}
.pt h3{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(90deg,#53fc18,#35d0ff);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.pt p{font-size:12.5px;color:var(--mute);margin:4px 0 9px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.promo .x{position:absolute;top:8px;right:8px;width:26px;height:26px;display:grid;place-items:center;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.soon{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 14px #53fc18aa}}}
@media (orientation:landscape) and (max-height:500px){header,#add{display:none}#chips{padding:6px 12px;min-height:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="pt">
    <span class="soon">Novo APK · em breve</span>
    <h3>KiView</h3>
    <p>Todas as suas lives da Kick numa tela só, até 10 ao mesmo tempo.</p>
    <div class="tags"><span>Kick</span><span>Multi-live</span><span>Qualidade máxima</span></div>
  </div>
  <button class="x" id="adx" aria-label="Fechar aviso"><svg viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</section>
<main id="stage"></main>
<nav class="dock" aria-label="Layout">
  <div id="modes" style="display:flex;gap:4px"></div><i></i>
  <button id="bMax" aria-label="Qualidade máxima" style="font-size:12px;letter-spacing:.02em">MAX</button>
  <button id="bChat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg></button>
</nav>


<script>
const $=s=>document.querySelector(s);
const parent=(location.hostname||"localhost");
const MAX_LIVES=10, MODES=[1,2,4,6,10];
/* Perfis de rede (nao exibidos). HTML nao aplica DNS/VPN: serve de config para wrapper nativo. */
const NETWORK_PROFILES={
  dns:[
    "dns.adguard-dns.com","family.adguard-dns.com",
    "adblock.dns.mullvad.net","base.dns.mullvad.net","extended.dns.mullvad.net","all.dns.mullvad.net",
    "dns.quad9.net","dns11.quad9.net",
    "security.cloudflare-dns.com","family.cloudflare-dns.com",
    "p2.freedns.controld.com","dns.nextdns.io",
    "noads.libredns.gr","dnsforge.de",
    "security-filter-dns.cleanbrowsing.org","family-filter-dns.cleanbrowsing.org","adult-filter-dns.cleanbrowsing.org",
    "dns.digitale-gesellschaft.ch","dns.switch.ch","doh.opendns.com"
  ],
  vpn:[]
};
const DNS_MAIN="dns.adguard-dns.com";
let S={chans:[],sel:[],mode:1,chat:true,block:false,ad:true,max:true};
let players=[];
try{S=Object.assign(S,JSON.parse(localStorage.getItem("tv")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("tv",JSON.stringify(S))}catch(e){}};
const clean=v=>v.trim().toLowerCase().replace(/^.*twitch\.tv\//,"").replace(/[^a-z0-9_]/g,"");
const hue=c=>{let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;return h};
const X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function chips(){
  const box=$("#chips");box.textContent="";
  S.chans.forEach(c=>{
    const d=document.createElement("div");d.className="chip"+(S.sel.includes(c)?" on":"");
    const b=document.createElement("button");b.style.cssText="display:flex;align-items:center;gap:9px";
    const a=document.createElement("span");a.className="av";a.textContent=c[0];
    a.style.background="linear-gradient(135deg,hsl("+hue(c)+",80%,60%),hsl("+(hue(c)+50)+",80%,45%))";
    const n=document.createElement("b");n.textContent=c;
    b.append(a,n);b.onclick=()=>pick(c);
    const x=document.createElement("button");x.className="x";x.innerHTML=X;x.setAttribute("aria-label","Remover "+c);x.onclick=()=>del(c);
    d.append(b,x);box.append(d);
  });
}
function pick(c){
  if(S.sel.includes(c))S.sel=S.sel.filter(v=>v!==c);
  else{S.sel.push(c);while(S.sel.length>Math.min(S.mode,MAX_LIVES))S.sel.shift()}
  save();render();
}
function del(c){S.chans=S.chans.filter(v=>v!==c);S.sel=S.sel.filter(v=>v!==c);save();render()}
function add(c){if(!c)return;if(!S.chans.includes(c))S.chans.push(c);pick(c)}
function dock(){
  const m=$("#modes");m.textContent="";
  MODES.forEach(k=>{
    const b=document.createElement("button");b.textContent=k;b.className=S.mode===k?"on":"";
    b.setAttribute("aria-label",k+(k>1?" lives":" live"));
    b.onclick=()=>{S.mode=k;S.sel=S.sel.slice(-k);save();render()};
    m.append(b);
  });
  $("#bChat").className=S.chat?"on":"";$("#bMax").className=S.max?"on":"";
}
function render(){
  chips();dock();
  const st=$("#stage");st.textContent="";
  const n=S.sel.length;players=[];
  st.style.gridTemplateColumns=n>6?"1fr 1fr 1fr":n>1?"1fr 1fr":"1fr";
  if(!n){
    const e=document.createElement("div");e.className="empty";
    e.innerHTML='<div class="big"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div><h2>Suas lives num só lugar</h2><p>Adicione um canal para começar.</p>';
    const s=document.createElement("div");s.className="sug";
    ["gaules","alanzoka","cellbit"].forEach(c=>{const b=document.createElement("button");b.textContent="+ "+c;b.onclick=()=>add(c);s.append(b)});
    e.append(s);st.append(e);
  }
  S.sel.forEach((c,i)=>{
    const cell=document.createElement("div");cell.className="cell";
    const l=document.createElement("span");l.className="tag";l.textContent=c;
    if(window.Twitch&&Twitch.Player){
      const d=document.createElement("div");d.id="pl"+i;d.style.cssText="position:absolute;inset:0";
      cell.append(d,l);st.append(cell);
      const pl=new Twitch.Player(d.id,{channel:c,parent:[parent],width:"100%",height:"100%",autoplay:true,muted:i>0});
      pl.addEventListener(Twitch.Player.PLAYING,()=>quality(pl));
      players.push({pl,l,c});
    }else{
      const f=document.createElement("iframe");
      f.src="https://player.twitch.tv/?channel="+c+"&parent="+parent+"&autoplay=true&muted="+(i>0);
      f.allowFullscreen=true;f.allow="autoplay; fullscreen";
      cell.append(f,l);st.append(cell);
    }
  });
  if(n===1&&S.chat){
    const ch=document.createElement("div");ch.className="cell";
    const cf=document.createElement("iframe");
    cf.src="https://www.twitch.tv/embed/"+S.sel[0]+"/chat?darkpopout&parent="+parent;
    ch.append(cf);st.append(ch);
  }
}
$("#add").onsubmit=e=>{e.preventDefault();const c=clean($("#in").value);$("#in").value="";add(c)};
$("#bChat").onclick=()=>{S.chat=!S.chat;save();render()};
function quality(pl){try{pl.setQuality(S.max?"chunked":"auto")}catch(e){}}
$("#bMax").onclick=()=>{S.max=!S.max;save();players.forEach(o=>quality(o.pl));dock();toast(S.max?"Qualidade máxima":"Qualidade automática")};
setInterval(()=>players.forEach(o=>{try{
  const t=o.pl.getPlaybackStats(),h=String(t.videoResolution||"").split("x")[1];
  o.l.textContent=o.c+(h?" · "+h+"p"+(t.fps?Math.round(t.fps):""):"");
}catch(e){}}),3000);
async function ping(){const t=performance.now();try{await fetch("https://www.twitch.tv/favicon.ico?"+Date.now(),{mode:"no-cors",cache:"no-store"});return Math.round(performance.now()-t)}catch(e){return null}}
async function net(){
  const box=$("#net");let ms=navigator.onLine?await ping():null;
  const c=navigator.connection,dl=c&&c.downlink?" · ~"+c.downlink+" Mb/s":"";
  const k=ms===null?"r":ms<90?"g":ms<220?"y":"r";
  box.className="net "+k;
  $("#nt").textContent=ms===null?"Sem conexão":(k==="g"?"Rede boa":k==="y"?"Rede instável":"Rede lenta")+" · "+ms+" ms"+dl;
}
addEventListener("online",net);addEventListener("offline",net);
net();setInterval(net,5000);
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function blockUI(){const b=$("#bBlock");b.classList.toggle("on",S.block);b.setAttribute("aria-pressed",S.block);$("#bl").textContent=S.block?"Bloqueio ativo":"Bloqueio"}
$("#bBlock").onclick=async()=>{
  S.block=!S.block;save();blockUI();
  if(!S.block)return;
  try{if(window.TVNative&&TVNative.enableBlock)TVNative.enableBlock(JSON.stringify(NETWORK_PROFILES))}catch(e){}
  let ok=false;try{await navigator.clipboard.writeText(DNS_MAIN);ok=true}catch(e){}
  toast(ok?"Bloqueio ativo · DNS copiado":"Bloqueio ativo");
  try{location.href="intent:#Intent;action=android.settings.WIRELESS_SETTINGS;end"}catch(e){}
};
$("#adx").onclick=e=>{e.preventDefault();e.stopPropagation();S.ad=false;save();$("#ad").hidden=true};
$("#ad").hidden=!S.ad;
blockUI();
render();
</script>
</body>
</html>
